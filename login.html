<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เข้าสู่ระบบ — E-Borrow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="page page--narrow" style="padding-top:40px">

  <div class="text-center" style="margin-bottom:24px">
    <div style="font-size:3rem">🔧</div>
    <h1 id="appName">E-Borrow</h1>
    <p class="text-muted">ระบบยืม-คืนอุปกรณ์ห้องเรียน</p>
  </div>

  <div id="announcement"></div>

  <div class="card">
    <h2>เข้าสู่ระบบ</h2>
    <form id="loginForm" onsubmit="return false">
      <div class="field">
        <label for="studentId">รหัสนักศึกษา</label>
        <input class="input" type="text" id="studentId" inputmode="numeric"
               autocomplete="username" required placeholder="เช่น 67301001">
      </div>
      <div class="field">
        <label for="pin">PIN</label>
        <input class="input pin-input" type="password" id="pin" inputmode="numeric"
               autocomplete="current-password" required maxlength="8" placeholder="••••">
      </div>
      <button type="submit" class="btn btn--primary btn--block btn--lg" id="submitBtn">
        เข้าสู่ระบบ
      </button>
    </form>

    <p class="text-center mt-3 mb-0 text-sm">
      ยังไม่มีบัญชี? <a href="register.html">สมัครใช้งาน</a>
    </p>
  </div>

  <p class="text-center text-sm text-muted mt-3">
    ลืม PIN? แจ้งครูเพื่อรีเซ็ตให้
  </p>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  // เข้าระบบอยู่แล้วก็ข้ามไปเลย
  if (API.isLoggedIn()) {
    location.replace(CONFIG.BASE_PATH + (API.isAdmin() ? 'admin/dashboard.html' : 'catalog.html'));
    return;
  }

  // ผูกปุ่มก่อนเสมอ อย่า await อะไรก่อนบรรทัดนี้
  // ถ้าปล่อยให้รอเซิร์ฟเวอร์ (ซึ่งช้าได้หลายสิบวินาที) แล้วผู้ใช้กดปุ่มระหว่างรอ
  // ฟอร์มจะถูกส่งแบบธรรมดา หน้าจะโหลดใหม่ และข้อมูลที่กรอกจะหายหมด
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const studentId = document.getElementById('studentId').value.trim();
    const pin = document.getElementById('pin').value;

    await UI.withButton(btn, async () => {
      try {
        const res = await API.write('login', {
          student_id: studentId, pin,
          user_agent: navigator.userAgent
        }, { noRedirect: true });

        API.setSession(res.token, res.student);
        location.replace(CONFIG.BASE_PATH +
          (res.student.role === 'ADMIN' ? 'admin/dashboard.html' : 'catalog.html'));
      } catch (err) {
        UI.apiError(err);
        document.getElementById('pin').value = '';
        document.getElementById('pin').focus();
      }
    }, 'กำลังเข้าสู่ระบบ...');
  });

  // โหลดชื่อระบบกับประกาศทีหลัง — ไม่สำคัญพอที่จะให้ปุ่มรอ
  try {
    const cfg = await API.read('getPublicConfig', {}, { noRedirect: true, retries: 2 });
    if (cfg.app_name) {
      document.getElementById('appName').textContent = cfg.app_name;
      document.title = 'เข้าสู่ระบบ — ' + cfg.app_name;
    }
    if (cfg.announcement) {
      document.getElementById('announcement').innerHTML =
        `<div class="alert alert--info">${UI.esc(cfg.announcement)}</div>`;
    }
  } catch (err) {
    document.getElementById('announcement').innerHTML =
      `<div class="alert alert--danger">
         เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือแจ้งครู
       </div>`;
  }
})();
</script>
</body>
</html>
