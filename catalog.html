<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืมอุปกรณ์ — E-Borrow</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="header"></div>

<div class="page">
  <div id="myStatus"></div>
  <div id="steps"></div>
  <div id="alerts"></div>

  <div class="search-bar">
    <span class="search-bar__icon" id="searchIcon"></span>
    <input type="search" id="search" placeholder="ค้นหาอุปกรณ์..." autocomplete="off"
           aria-label="ค้นหาอุปกรณ์">
  </div>

  <div class="category-strip" id="categories"></div>

  <div id="itemGrid" class="item-grid"></div>
  <div id="emptyState"></div>
</div>

<div id="checkoutBar"></div>
<div id="bottomNav"></div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  if (!UI.requireLogin()) return;

  let catalog = { items: [], categories: [] };
  let activeCategory = '';
  let query = '';

  function renderNav() {
    document.getElementById('header').innerHTML = UI.renderHeader('catalog');
    document.getElementById('bottomNav').innerHTML = UI.renderBottomNav('catalog');
    renderCheckoutBar();
  }

  /**
   * สถานะของฉัน — นักเรียนเห็นทันทีว่ามีของต้องคืน / คำขอรอครู
   * โดยไม่ต้องไปเปิดหน้า "ของฉัน" เอง
   */
  function renderMyStatus(txns) {
    const el = document.getElementById('myStatus');
    const by = s => txns.filter(t => s.includes(t.status));
    const overdue = by(['OVERDUE']);
    const inUse = by(['IN_USE', 'PARTIALLY_RETURNED']);
    const ready = by(['APPROVED']);
    const waiting = by(['REQUESTED']);

    // เรียงตามความเร่งด่วน: เกินกำหนด > ไปรับของ > กำลังยืม > รออนุมัติ
    const items = [];
    if (overdue.length) items.push({ cls: 'danger', icon: 'alert',
      title: `มีของเกินกำหนดคืน ${overdue.length} รายการ`, sub: 'คืนก่อนจึงจะยืมใหม่ได้',
      action: `<a class="btn btn--danger btn--sm" href="return.html?txn=${encodeURIComponent(overdue[0].txn_id)}">คืนเลย</a>`,
      short: `เกินกำหนด ${overdue.length}` });
    if (ready.length) items.push({ cls: 'info', icon: 'check',
      title: `ครูอนุมัติแล้ว ${ready.length} รายการ`, sub: 'ไปรับอุปกรณ์ที่ครูได้เลย',
      short: `รอรับของ ${ready.length}` });
    if (inUse.length) {
      const next = inUse.slice().sort((x, y) => (x.due_at || '').localeCompare(y.due_at || ''))[0];
      items.push({ cls: 'ok', icon: 'clock',
        title: `กำลังยืมอยู่ ${inUse.length} รายการ`, sub: `ครบกำหนดคืน${UI.relativeDue(next.due_at).text}`,
        action: `<a class="btn btn--ghost btn--sm" href="my-loans.html">ดู / คืน</a>`,
        short: `กำลังยืม ${inUse.length}` });
    }
    if (waiting.length) items.push({ cls: 'info', icon: 'clock',
      title: `คำขอรอครูอนุมัติ ${waiting.length} รายการ`, sub: 'ครูอนุมัติแล้วจะขึ้นที่นี่',
      action: `<a class="btn btn--ghost btn--sm" href="my-loans.html">ดูคำขอ</a>`,
      short: `รออนุมัติ ${waiting.length}` });

    if (!items.length) { el.innerHTML = ''; renderSteps(true); return; }

    const [top, ...rest] = items;
    const more = rest.length
      ? ` · <a href="my-loans.html">${rest.map(r => r.short).join(' · ')}</a>` : '';
    el.innerHTML = `
      <div class="status-banner status-banner--${top.cls}" ${top.cls === 'danger' ? 'role="alert"' : ''}>
        ${UI.icon(top.icon)}
        <div class="status-banner__text"><strong>${top.title}</strong>
          <small>${top.sub}${more}</small></div>
        ${top.action || ''}
      </div>`;
    renderSteps(false);
  }

  // ขั้นตอนการยืม — สำหรับคนที่ยังไม่มีรายการค้าง ปิดได้และจำไว้
  function renderSteps(show) {
    let hidden = false;
    try { hidden = localStorage.getItem('eborrow_hide_steps') === '1'; } catch {}
    const el = document.getElementById('steps');
    if (!show || hidden) { el.innerHTML = ''; return; }
    el.innerHTML = `
      <div class="steps">
        <div class="steps__title">ยืมอุปกรณ์ง่ายๆ 4 ขั้นตอน</div>
        <button class="steps__close" id="hideSteps" aria-label="ซ่อนขั้นตอน">${UI.icon('x')}</button>
        <ol class="steps__list">
          <li>เลือกอุปกรณ์ใส่ตะกร้า</li>
          <li>กดส่งคำขอยืม</li>
          <li>รับของจากครู</li>
          <li>คืนพร้อมถ่ายรูป</li>
        </ol>
      </div>`;
    document.getElementById('hideSteps').addEventListener('click', () => {
      try { localStorage.setItem('eborrow_hide_steps', '1'); } catch {}
      el.innerHTML = '';
    });
  }

  async function loadMyStatus() {
    try {
      const res = await API.read('myTransactions', { status_filter: 'open' });
      renderMyStatus(res.transactions);
    } catch { /* ไม่ใช่ข้อมูลหลักของหน้า โหลดไม่ได้ก็ข้าม */ }
  }

  // ใส่ตะกร้าแล้วต้องเห็นทันทีว่าขั้นต่อไปคืออะไร — ไม่ต้องไปหาไอคอนตะกร้าเอง
  function renderCheckoutBar(bump) {
    const kinds = Cart.lineCount();
    const page = document.querySelector('.page');
    const bar = document.getElementById('checkoutBar');
    page.classList.toggle('page--has-bar', kinds > 0);
    if (!kinds) { bar.innerHTML = ''; return; }

    bar.innerHTML = `
      <div class="sticky-bar sticky-bar--nav">
        <div class="sticky-bar__info">
          ${UI.icon('cart')} เลือกแล้ว <strong>${kinds}</strong> ชนิด · <strong>${Cart.count()}</strong> ชิ้น
          <div class="text-sm text-muted">เลือกครบแล้วกดปุ่มเพื่อส่งคำขอ</div>
        </div>
        <a href="cart.html" class="btn btn--primary btn--lg ${bump ? 'is-bump' : ''}">ไปส่งคำขอยืม →</a>
      </div>`;
  }

  function stockClass(item) {
    if (item.available_qty <= 0) return 'out';
    if (item.available_qty <= 2) return 'low';
    return 'ok';
  }

  function renderItems() {
    const q = query.trim().toLowerCase();
    const list = catalog.items.filter(i => {
      if (activeCategory && i.category_id !== activeCategory) return false;
      if (q) {
        const hay = `${i.name_th} ${i.name_en} ${i.tags}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });

    const grid = document.getElementById('itemGrid');
    const empty = document.getElementById('emptyState');

    if (!list.length) {
      grid.innerHTML = '';
      empty.innerHTML = UI.empty(
        q ? `ไม่พบอุปกรณ์ที่ตรงกับ "${query}"` : 'ยังไม่มีอุปกรณ์ในหมวดนี้', '🔍');
      return;
    }
    empty.innerHTML = '';

    grid.innerHTML = list.map(item => {
      const out = item.available_qty <= 0;
      const inCart = Cart.qtyOf(item.item_id);
      const max = item.max_per_borrow > 0
        ? Math.min(item.max_per_borrow, item.available_qty) : item.available_qty;
      const atMax = inCart >= max;

      return `
      <div class="item-card">
        <div class="item-card__media">
          ${UI.itemImage(item)}
          ${item.is_consumable ? '<span class="tag-consumable">สิ้นเปลือง</span>' : ''}
          ${out ? '<div class="tag-out">หมด</div>' : ''}
        </div>
        <div class="item-card__body">
          <div class="item-card__name">${UI.esc(item.name_th)}</div>
          <div class="item-card__meta">
            <span class="item-card__stock item-card__stock--${stockClass(item)}">
              เหลือ ${item.available_qty} ${UI.esc(item.unit)}
            </span>
            ${item.max_per_borrow > 0
              ? `<span class="text-muted">ยืมได้ไม่เกิน ${item.max_per_borrow}</span>`
              : ''}
          </div>
          ${inCart ? `
            <div class="card-stepper" data-id="${UI.esc(item.item_id)}">
              <button data-step="-1" aria-label="ลดจำนวน ${UI.esc(item.name_th)}">−</button>
              <span title="จำนวนในตะกร้า">${inCart} ${UI.esc(item.unit)}</span>
              <button data-step="1" ${atMax ? 'disabled' : ''}
                      aria-label="เพิ่มจำนวน ${UI.esc(item.name_th)}">+</button>
            </div>` : `
            <button class="btn-add" data-id="${UI.esc(item.item_id)}" ${out ? 'disabled' : ''}>
              ${out ? 'หมด' : '+ ใส่ตะกร้า'}
            </button>`}
        </div>
      </div>`;
    }).join('');
  }

  function renderCategories() {
    const counts = {};
    catalog.items.forEach(i => {
      counts[i.category_id] = (counts[i.category_id] || 0) + 1;
    });

    document.getElementById('categories').innerHTML = `
      <button class="cat-chip ${!activeCategory ? 'is-active' : ''}" data-cat="">
        ทั้งหมด (${catalog.items.length})
      </button>
      ${catalog.categories.filter(c => counts[c.category_id]).map(c => `
        <button class="cat-chip ${activeCategory === c.category_id ? 'is-active' : ''}"
                data-cat="${UI.esc(c.category_id)}">
          ${UI.esc(c.icon || '📦')} ${UI.esc(c.name_th)} (${counts[c.category_id]})
        </button>
      `).join('')}`;
  }

  async function loadCatalog(force) {
    // ใช้แคชในเครื่องก่อน เปิดหน้าเร็วทันที แล้วค่อยเช็กเวอร์ชันเบื้องหลัง
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(CONFIG.CATALOG_CACHE_KEY) || 'null'); } catch {}

    if (cached && !force) {
      catalog = cached;
      renderCategories();
      renderItems();
    } else {
      UI.loading(true, 'กำลังโหลดอุปกรณ์...');
    }

    try {
      const fresh = await API.read('getCatalog');
      catalog = fresh;
      try { localStorage.setItem(CONFIG.CATALOG_CACHE_KEY, JSON.stringify(fresh)); } catch {}

      const changes = Cart.reconcile(fresh.items);
      if (changes.length) {
        document.getElementById('alerts').innerHTML =
          `<div class="alert alert--warn">ตะกร้าถูกปรับ: ${changes.map(UI.esc).join(', ')}</div>`;
        renderNav();
      }

      renderCategories();
      renderItems();
    } catch (err) {
      if (!cached) UI.apiError(err);
    } finally {
      UI.loading(false);
    }
  }

  // ---- events ----

  document.getElementById('categories').addEventListener('click', e => {
    const chip = e.target.closest('.cat-chip');
    if (!chip) return;
    activeCategory = chip.dataset.cat;
    renderCategories();
    renderItems();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  let searchTimer;
  document.getElementById('search').addEventListener('input', e => {
    query = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(renderItems, 180);
  });

  document.getElementById('itemGrid').addEventListener('click', e => {
    // ปุ่ม − / + บนการ์ดที่อยู่ในตะกร้าแล้ว
    const step = e.target.closest('[data-step]');
    if (step && !step.disabled) {
      const id = step.closest('.card-stepper').dataset.id;
      Cart.setQty(id, Cart.qtyOf(id) + Number(step.dataset.step));
      renderNav();
      renderItems();
      return;
    }

    const btn = e.target.closest('.btn-add');
    if (!btn || btn.disabled) return;

    const item = catalog.items.find(i => i.item_id === btn.dataset.id);
    if (!item) return;

    Cart.add(item, 1);
    renderNav();
    renderCheckoutBar(true);
    renderItems();
    UI.toast(`เพิ่ม "${item.name_th}" ลงตะกร้าแล้ว`, 'success', 1600);
  });

  document.addEventListener('cart:changed', renderNav);

  document.getElementById('searchIcon').innerHTML = UI.icon('search');
  renderNav();
  loadMyStatus();
  await loadCatalog(false);
})();
</script>
</body>
</html>
