# กันโปรเจกต์ Supabase ฟรีถูกพัก (pause) เมื่อไม่มีใครใช้ 7 วัน เช่นช่วงปิดเทอม
# ยิงคำสั่ง ping ทุก 3 วัน — อ่าน URL และ anon key จาก js/config.js (ค่าสาธารณะอยู่แล้ว)
name: keep-supabase-awake

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ping
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL: '\([^']*\)'.*/\1/p" js/config.js)
          KEY=$(sed -n "s/.*SUPABASE_ANON_KEY: '\([^']*\)'.*/\1/p" js/config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/api" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"action":"ping","token":null,"payload":{},"request_id":null}'
